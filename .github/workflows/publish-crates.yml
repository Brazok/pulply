# Publishes pulply-api, then pulply, to crates.io (cargo-dist publish-jobs).
name: Publish crates

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  # Manual run, e.g. to finish a release whose publish step failed.
  workflow_dispatch:

jobs:
  crates:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/pulply/web/package-lock.json
      # The crate ships the prebuilt web interface (web/dist), not its sources.
      - name: Build the web interface
        working-directory: crates/pulply/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      # Skips crates whose version is already on crates.io, so a rerun only publishes what's missing.
      # web/dist is gitignored but shipped through `include`, so cargo sees it as uncommitted (--allow-dirty).
      - name: Publish pulply-api, then pulply
        run: |
          for crate in pulply-api pulply; do
            version=$(cargo metadata --no-deps --format-version 1 | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            status=$(curl -s -o /dev/null -w '%{http_code}' -A 'pulply-release-ci' "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = 200 ]; then
              echo "$crate $version is already on crates.io, skipping"
              continue
            fi
            cargo publish --locked --allow-dirty -p "$crate"
          done
