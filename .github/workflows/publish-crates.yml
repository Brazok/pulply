# Publishes pulply-api, then pulply, to crates.io (cargo-dist publish-jobs).
name: Publish crates

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  crates:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/pulply/web/package-lock.json
      # The crate ships the prebuilt web interface (web/dist), not its sources.
      - name: Build the web interface
        working-directory: crates/pulply/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - run: cargo publish --locked -p pulply-api
      # web/dist is gitignored but shipped through `include`, so cargo sees it as uncommitted.
      - run: cargo publish --locked -p pulply --allow-dirty
