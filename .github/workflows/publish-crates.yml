# Publishes pulply-api, then pulply, to crates.io (cargo-dist publish-jobs).
name: Publish crates

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  crates:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked -p pulply-api
      - run: cargo publish --locked -p pulply
