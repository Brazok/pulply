[package]
name = "pulply-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
futures = "0.3.34"
hex = "0.4.3"
indexmap = { version = "2.14.2", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "stream", "query", "multipart", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "time", "sync", "fs", "io-util"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
flate2 = "1.1.10"
tempfile = "3.27.0"
wiremock = "0.6.5"
